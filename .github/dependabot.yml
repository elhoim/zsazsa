# Dependency update PRs. Two ecosystems: the Python requirements, and the
# actions the workflows call, which are the supply chain of CI itself.
version: 2

updates:
  # requirements.in holds the ranges zsazsa needs and requirements.txt the
  # exact versions, compiled from it by uv. The uv ecosystem, not pip, is the
  # one that understands that pair: it recompiles the lock with the options in
  # its header, --universal and --python-version among them. Grouped and weekly
  # to keep it to one review rather than one per package.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Updates the pins in requirements.txt within the ranges, and only moves a
    # range in requirements.in when the new version falls outside it. The
    # default, "increase", would raise every lower bound to whatever is newest,
    # and the lower bound is what zsazsa needs, not what it was tested with.
    versioning-strategy: increase-if-necessary
    ignore:
      # requirements.in caps openai below 3 on purpose and we stay there. The
      # call surface in analyser/llm.py was checked against 3.19.2 and works, so
      # this is not a known break, it is that no test exercises the SDK: a later
      # 3.x could move something under us and CI would stay green. Moving up is
      # a deliberate piece of work, starting with that test.
      #
      # A version range rather than update-types: the same rule written as
      # update-types semver-major did not stop Dependabot proposing the ceiling
      # change in PR 33. Note this also hides a security advisory whose only
      # fix is in 3.x, so revisit if one appears.
      - dependency-name: openai
        versions: [">=3"]
    groups:
      python-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "deps"

  # The workflows pin actions by commit SHA, which is what stops a moving tag
  # from changing what CI runs. That only stays current if something updates
  # the SHAs, which is this.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
